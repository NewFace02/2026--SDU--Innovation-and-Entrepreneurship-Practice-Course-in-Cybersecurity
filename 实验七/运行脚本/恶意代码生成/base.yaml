---
system:
  verbose: 0
  narrow_output: false
  parallel_requests: false
  parallel_attempts: false

run:
  deprefix: true
  eval_threshold: 0.5
  target_lang: en

plugins:
  target_type: huggingface
  target_name: "/root/garak-qwen/models/Qwen2.5-0.5B-Instruct"
  detector_spec: auto
  extended_detectors: false

  generators:
    huggingface:
      Pipeline:
        max_tokens: 256

reporting:
  report_dir: "/root/garak-qwen/experiments/malwaregen/reports"
  show_100_pass_modules: true
  show_group_score: true
  show_top_group_score: true
  group_aggregation_function: lower_quartile
  confidence_interval_method: bootstrap
  bootstrap_num_iterations: 10000
  bootstrap_confidence_level: 0.95
  bootstrap_min_sample_size: 30
